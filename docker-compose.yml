services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://nossocrm:${DB_PASSWORD:-nossocrm123}@postgres:5432/nossocrm
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nossocrm
      POSTGRES_USER: nossocrm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nossocrm123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nossocrm -d nossocrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    restart: unless-stopped

volumes:
  pgdata:
